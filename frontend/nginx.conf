
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Backend health endpoint
    location = /api/v1/health {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        proxy_pass https://lunarnote-backend.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_set_header Host lunarnote-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for backend API
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        proxy_pass https://lunarnote-backend.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host lunarnote-backend.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health endpoint
    location = /health {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        proxy_pass https://lunarnote-backend.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_set_header Host lunarnote-backend.onrender.com;
    }

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
